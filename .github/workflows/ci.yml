name: extension-ci

on:
  pull_request:
  push:
    branches:
      - master
      - language-only
      - release/swahilipro-language-v1.0.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Package VSIX
        run: npm run package
      - name: Verify VSIX contains no executables or process/network code
        run: npm run verify
