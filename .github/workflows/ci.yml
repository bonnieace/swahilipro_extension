name: extension-ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate extension source
        run: npm run check

      - name: Validate VS Code package contents
        run: npx vsce ls

      - name: Smoke-test runtime injection
        shell: bash
        run: |
          cat > /tmp/swa <<'EOF'
          #!/bin/sh
          echo "SwahiliPro test runtime"
          EOF
          chmod +x /tmp/swa
          node scripts/package-with-runtime.js /tmp/swa linux-x64
          test -f dist/swahilipro-linux-x64.vsix
          unzip -l dist/swahilipro-linux-x64.vsix | grep 'extension/runtime/swa'
